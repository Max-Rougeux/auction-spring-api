services:
  sqlserver:
    container_name: ${CONTAINER_SQLSERVER}
    build:
      context: .
      dockerfile: docker/sqlserver/Dockerfile
    profiles: [ "sqlserver" ]
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${MS_DB_PASSWORD}
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: [ "CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${MS_DB_PASSWORD}", "-Q", "SELECT 1", "-C" ]
      interval: 10s
      retries: 10
      start_period: 40s
    ports:
      - "${MS_DB_PORT:-1433}:1433"
    networks:
      - internal

  postgresql:
    container_name: ${CONTAINER_POSTGRESQL}
    build:
      context: .
      dockerfile: docker/postgresql/Dockerfile
    profiles: [ "postgresql" ]
    environment:
      - POSTGRES_USER=${PG_DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${PG_DB_PASSWORD}
      - POSTGRES_DB=AUCTION
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PG_DB_USERNAME:-postgres} -d AUCTION" ]
      interval: 10s
      retries: 10
      start_period: 20s
    ports:
      - "${PG_DB_PORT:-5432}:5432"
    networks:
      - internal

volumes:
  sqlserver_data:
  postgresql_data:

networks:
  internal:
    driver: bridge
